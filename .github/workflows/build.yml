name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyaaf2
        run: python -m pip install pyaaf2

      - name: Build LibAAF's aaftool (reference reader for the tests)
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/agfline/LibAAF libaaf
          cmake -S libaaf -B libaaf/build -A x64
          cmake --build libaaf/build --config Release

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: |
          AAFTOOL=$(find libaaf -iname aaftool.exe 2>/dev/null | head -1)
          if [ -n "$AAFTOOL" ]; then
            export AAFTOOL="$PWD/$AAFTOOL" LIBAAF_TEST_DIR="$PWD/libaaf/test/aaf"
          else
            echo "aaftool not available: running without the LibAAF comparison"
          fi
          python tests/test_aaf.py build/Release

      - name: Package
        run: python tools/make_package.py

      - uses: actions/upload-artifact@v4
        with:
          name: AAF-for-REAPER
          path: dist/AAF-for-REAPER/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/AAF-for-REAPER-*-win64.zip \
            --title "AAF for REAPER $GITHUB_REF_NAME" --generate-notes
