name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win64
            configure: -A x64
          - os: macos-latest
            platform: macos
            configure: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyaaf2
        run: python -m pip install pyaaf2

      - name: Build LibAAF's aaftool (reference reader for the tests)
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/agfline/LibAAF libaaf
          cmake -S libaaf -B libaaf/build ${{ matrix.configure }} -DCMAKE_BUILD_TYPE=Release
          cmake --build libaaf/build --config Release

      - name: Configure
        run: cmake -S . -B build ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: |
          AAFTOOL=$(find libaaf -type f \( -name aaftool.exe -o -name aaftool \) 2>/dev/null | head -1)
          if [ -n "$AAFTOOL" ]; then
            export AAFTOOL="$PWD/$AAFTOOL" LIBAAF_TEST_DIR="$PWD/libaaf/test/aaf"
          else
            echo "aaftool not available: running without the LibAAF comparison"
          fi
          python tests/test_aaf.py build/Release

      - name: Check the macOS binaries
        if: runner.os == 'macOS'
        run: |
          lipo -info build/Release/reaper_aaf.dylib
          nm -gU build/Release/reaper_aaf.dylib | grep -E "ReaperPluginEntry"

      - name: Package
        run: python tools/make_package.py

      - uses: actions/upload-artifact@v4
        with:
          name: AAF-for-REAPER-${{ matrix.platform }}
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" \
            --title "AAF for REAPER $GITHUB_REF_NAME" --generate-notes
